<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VibeGap</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="app" class="pywebview-drag-region">
  <div id="statusbar" class="pywebview-drag-region">
    <span id="status-text" title="点击切换词书">VibeGap</span>
    <span id="status-right">
      <span id="btn-review" title="复习今日错词">复习</span>
      <span id="status-agents" title="点击查看会话"></span>
      <span id="btn-settings" title="设置">⚙</span>
      <span id="btn-close" title="隐藏 (Esc)">✕</span>
    </span>
  </div>
  <div id="banner" class="hidden pywebview-drag-region"></div>
  <div id="overlay" class="hidden"></div>
  <div id="panel-main" class="pywebview-drag-region"></div>
  <div id="panel-strip" class="hidden"></div>
</div>
<script src="shell.js"></script>
<script src="panels/word_card.js"></script>
<script src="panels/news_ticker.js"></script>
</body>
</html>
