name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Test
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=80
