name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Test
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=80
      - name: Test DSH client
        working-directory: vibegap/adapters/dsh/plugin
        run: npm test
