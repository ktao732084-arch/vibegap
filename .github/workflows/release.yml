name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.20.0 pytest pytest-cov
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run DSH plugin tests
        working-directory: vibegap/adapters/dsh/plugin
        run: npm test
      - name: Build portable bundle and installer
        shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VibeGap-Windows
          path: |
            dist/VibeGap-*-portable.zip
            dist/installer/VibeGap-*-Setup.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME `
            "dist/VibeGap-$version-portable.zip" `
            "dist/installer/VibeGap-$version-Setup.exe" `
            "dist/SHA256SUMS.txt" `
            --generate-notes
